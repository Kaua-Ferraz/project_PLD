[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pld-forecast"
version = "0.1.0"
description = "Coleta e preparação auditável para previsão do PLD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["curl_cffi>=0.7", "numpy>=1.24", "pandas>=2.0", "pyarrow>=15.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pld = "pld_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pld_forecast*"]
